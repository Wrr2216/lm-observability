# Also copy templates/notify/ into .github/actions/notify/.
# Copy to .github/workflows/docker-publish.yml in your project.
#
# Required secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   DOCKERHUB_TOKEN   - Docker Hub access token
#   PUSHOVER_TOKEN    - optional, Pushover application token (enables notifications)
#   PUSHOVER_USER     - optional, Pushover user key (required with PUSHOVER_TOKEN)
#
# Required repo vars (Settings -> Secrets and variables -> Actions -> Variables):
#   DOCKERHUB_USERNAME  - your Docker Hub username (image is pushed to <user>/<repo>)

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
  PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
  PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate configuration
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::Repo variable DOCKERHUB_USERNAME is required" && exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify build start
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          title: '${{ github.repository }}: Notify build start'
          message: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | commit ${{ github.sha }}'
          priority: '-1'
        env:
          WAZUH_HOST: ${{ vars.WAZUH_HOST || '51.81.233.158' }}
          WAZUH_PORT: ${{ vars.WAZUH_PORT || '514' }}
          WAZUH_PROTOCOL: ${{ vars.WAZUH_PROTOCOL || 'tcp' }}
          PUSHOVER_ENABLED: ${{ vars.PUSHOVER_ENABLED }}
          WAZUH_ENABLED: ${{ vars.WAZUH_ENABLED }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          title: '${{ github.repository }}: Notify success'
          message: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | commit ${{ github.sha }}'
          priority: '0'
        env:
          WAZUH_HOST: ${{ vars.WAZUH_HOST || '51.81.233.158' }}
          WAZUH_PORT: ${{ vars.WAZUH_PORT || '514' }}
          WAZUH_PROTOCOL: ${{ vars.WAZUH_PROTOCOL || 'tcp' }}
          PUSHOVER_ENABLED: ${{ vars.PUSHOVER_ENABLED }}
          WAZUH_ENABLED: ${{ vars.WAZUH_ENABLED }}

      - name: Notify failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          title: '${{ github.repository }}: Notify failure'
          message: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | commit ${{ github.sha }}'
          priority: '1'
        env:
          WAZUH_HOST: ${{ vars.WAZUH_HOST || '51.81.233.158' }}
          WAZUH_PORT: ${{ vars.WAZUH_PORT || '514' }}
          WAZUH_PROTOCOL: ${{ vars.WAZUH_PROTOCOL || 'tcp' }}
          PUSHOVER_ENABLED: ${{ vars.PUSHOVER_ENABLED }}
          WAZUH_ENABLED: ${{ vars.WAZUH_ENABLED }}
